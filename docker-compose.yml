version: '3.8'

services:
  shorts-bot:
    build: .
    container_name: shorts_bot
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - WHISPER_MODEL=base
      - LOG_LEVEL=INFO
    volumes:
      # Сохраняем результаты на хосте
      - ./results:/app/results
      - ./temp:/app/temp
      - ./cache:/app/cache
      - ./bot.db:/app/bot.db
      - ./bot.log:/app/bot.log
    restart: unless-stopped
    # Для облачных сервисов может понадобиться:
    # ports:
    #   - "8080:8080"
    
    # Лимиты на память (опционально)
